# Where each department's shared platform lives. One entry per department,
# filled in from platform-shared outputs when the department is added. The
# joiner role is not listed: platform-access.bicep derives its GUID.
# A project picks its department with `department:` in projects/<app>.yaml.

github:
  org: tiago-platform-lab
  template: tiago-platform-lab/tmpl-webapp-bicep
  # public: on GitHub Free, environment required reviewers only work on public
  # repos. Use private on GitHub Enterprise.
  visibility: public

azure:
  # westeurope rejected new subscriptions (capacity) when this was set up.
  location: swedencentral
  # Custom roles defined once by bootstrap/tier0.bicep (fixed GUIDs, same values
  # there). The vending identity may assign these and nothing outside its list.
  roles:
    caeJoiner: ae166dd6-747a-401b-b70f-8533acfae304
    whatIfReader: 4b16aabd-f527-4007-9d57-9ce3a5eba870

# One entry per department, added after platform-shared created its base.
# Shape of one entry:
#
#   <dept>:
#     environments:
#       dev:
#         resourceGroup: rg-<dept>-platform-dev
#         containerAppsEnvironmentName: cae-<dept>-dev
#       prod:
#         resourceGroup: rg-<dept>-platform-prod
#         containerAppsEnvironmentName: cae-<dept>-prod
#     registry:
#       resourceGroup: rg-<dept>-platform-dev
#       name: cr<dept>shared
#       loginServer: cr<dept>shared.azurecr.io
departments:
  aidelivery: # AI Delivery Team
    environments:
      dev:
        resourceGroup: rg-aidelivery-platform-dev
        containerAppsEnvironmentName: cae-aidelivery-dev
      prod:
        resourceGroup: rg-aidelivery-platform-prod
        containerAppsEnvironmentName: cae-aidelivery-prod
    registry:
      resourceGroup: rg-aidelivery-platform-dev
      name: craideliveryshared
      loginServer: craideliveryshared.azurecr.io
