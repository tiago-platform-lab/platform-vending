name: vend-project

# A merged projects/<name>.yaml becomes a project:
#   1. GitHub: create-repo.sh creates the repo from the template. First, because
#      the identities' OIDC trust names the repo by its ID (immutable subject).
#   2. Azure: project.bicep creates resource groups, identities, OIDC trust, roles
#   3. GitHub: configure-repo.sh wires the repo to those identities
# Every step is safe to re-run; re-running a project changes nothing.
#
# Runs as:
#   Azure   the vending identity (OIDC, trusts environment `vending` only)
#   GitHub  the vending GitHub App (installation token, org scope)

on:
  pull_request:
    paths: ['projects/**', 'infra/**', 'bootstrap/**', 'platform.yaml', 'scripts/**']
  push:
    branches: [main]
    paths: ['projects/*.yaml']
  workflow_dispatch:
    inputs:
      project:
        description: 'Re-run one project, e.g. projects/example-app.yaml'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: vend
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bicep compiles
        run: |
          az bicep install
          for f in infra/project.bicep infra/department.bicep bootstrap/tier0.bicep; do
            az bicep lint --file "$f"
            az bicep build --file "$f" --stdout > /dev/null
          done
      # Read-only token (validation GitHub App: Members and Metadata, read) so
      # the pull request can check against GitHub what vending would hit
      # later. Never the vending App: its key must not reach unreviewed code.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: check-token
        if: vars.VALIDATE_APP_ID != ''
        with:
          app-id: ${{ vars.VALIDATE_APP_ID }}
          private-key: ${{ secrets.VALIDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Project files are well formed
        # Every record offline; the records this pull request adds or changes
        # also online (teams exist, repo free). The vend job checks again, as
        # the last barrier before anything is created.
        env:
          GH_TOKEN: ${{ steps.check-token.outputs.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          shopt -s nullglob # no projects yet is fine
          git fetch -q --depth=1 origin "$BASE"
          changed=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'projects/*.yaml')
          [ -n "$GH_TOKEN" ] || echo "::warning::No validation App token: online checks skipped until vending."
          status=0
          for f in projects/*.yaml; do
            mode=""
            if [ -n "$GH_TOKEN" ] && grep -qx "$f" <<< "$changed"; then mode=--online; fi
            scripts/validate-project.sh "$f" platform.yaml ${mode:+"$mode"} || status=1
          done
          exit "$status"
      - name: Scripts pass shellcheck
        run: shellcheck scripts/*.sh

  vend:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: vending # required reviewers on this environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Which projects
        id: which
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_PROJECT" ]; then
            files="$INPUT_PROJECT"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # First push of the repo (or a rewritten history): nothing to diff
            # against. Vend nothing; use Run workflow for each project instead.
            echo "::warning::No usable base commit; vend projects with Run workflow."
            files=""
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'projects/*.yaml')
          fi
          # Only well-formed project paths go further.
          files=$(printf '%s\n' "$files" | grep -E '^projects/[a-z0-9-]{3,16}\.yaml$' || true)
          { echo "files<<EOF"; echo "$files"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "Projects to vend:"; echo "$files"

      # Nothing to vend (e.g. only a non-project file changed): stop here,
      # without logging in anywhere.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.which.outputs.files != ''
        with:
          client-id: ${{ vars.VENDING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.which.outputs.files != ''
        id: app-token
        with:
          app-id: ${{ vars.VENDING_APP_ID }}
          private-key: ${{ secrets.VENDING_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Every project is checked against GitHub before any of them is vended:
      # a missing team or a foreign repo stops the run before anything exists.
      - name: Preflight
        if: steps.which.outputs.files != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FILES: ${{ steps.which.outputs.files }}
        run: |
          status=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            scripts/validate-project.sh "$f" platform.yaml --online || status=1
          done <<< "$FILES"
          exit "$status"

      - name: Vend
        if: steps.which.outputs.files != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          FILES: ${{ steps.which.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            name=$(yq '.name' "$f")
            echo "::group::GitHub repo: $name"
            subject_prefix=$(scripts/create-repo.sh "$f" platform.yaml)
            echo "OIDC subject prefix: $subject_prefix"
            echo "::endgroup::"
            echo "::group::Azure: $name"
            # The department's platform (its environment and registry) and the
            # tier-0 role GUIDs come from platform.yaml.
            jq -n \
              --argjson p "$(yq -o=json "$f")" \
              --argjson pl "$(yq -o=json platform.yaml)" \
              --arg sp "$subject_prefix" \
              '$pl.departments[$p.department] as $d
               | if $d == null then error("unknown department \($p.department)") else . end
               | { "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
                   contentVersion: "1.0.0.0",
                   parameters: {
                     appName:      { value: $p.name },
                     subjectPrefix: { value: $sp },
                     location:     { value: $pl.azure.location },
                     tags:         { value: $p.tags },
                     environments: { value: $p.environments },
                     platform:     { value: $d.environments },
                     registry:     { value: $d.registry },
                     roles:        { value: $pl.azure.roles } } }' > params.json
            az deployment sub create \
              --name "vend-$name" \
              --location "$(yq '.azure.location' platform.yaml)" \
              --template-file infra/project.bicep \
              --parameters @params.json \
              --query properties.outputs -o json > outputs.json
            echo "::endgroup::"
            echo "::group::GitHub config: $name"
            scripts/configure-repo.sh "$f" platform.yaml outputs.json
            echo "::endgroup::"
          done <<< "$FILES"
